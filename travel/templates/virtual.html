{% extends 'layout.html' %}{% block title %}Tur 360° — {{ posts.title }}{% endblock %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-3"><div><h1 class="h3 mb-0">{{ posts.title }}</h1><small class="text-secondary">Geser untuk melihat sekeliling • Scroll untuk zoom</small></div><a class="btn btn-outline-dark" href="{% url 'home' %}">Kembali</a></div>{% if posts.virtualtour %}<div id="viewer" style="height:calc(100vh - 190px);min-height:420px;border-radius:16px;overflow:hidden;background:#111"></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';const host=document.getElementById('viewer');const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(75,host.clientWidth/host.clientHeight,1,1100);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(host.clientWidth,host.clientHeight);host.appendChild(renderer.domElement);const geometry=new THREE.SphereGeometry(500,64,40);geometry.scale(-1,1,1);const texture=new THREE.TextureLoader().load('{{ posts.virtualtour.url|escapejs }}');scene.add(new THREE.Mesh(geometry,new THREE.MeshBasicMaterial({map:texture})));let lon=0,lat=0,down=false,x=0,y=0,lon0=0,lat0=0;host.addEventListener('pointerdown',e=>{down=true;x=e.clientX;y=e.clientY;lon0=lon;lat0=lat;host.setPointerCapture(e.pointerId)});host.addEventListener('pointermove',e=>{if(down){lon=(x-e.clientX)*.12+lon0;lat=(e.clientY-y)*.12+lat0}});host.addEventListener('pointerup',()=>down=false);host.addEventListener('wheel',e=>{camera.fov=THREE.MathUtils.clamp(camera.fov+e.deltaY*.04,25,90);camera.updateProjectionMatrix()});function resize(){camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)}window.addEventListener('resize',resize);function animate(){requestAnimationFrame(animate);const phi=THREE.MathUtils.degToRad(90-THREE.MathUtils.clamp(lat,-85,85));const theta=THREE.MathUtils.degToRad(lon);camera.lookAt(500*Math.sin(phi)*Math.cos(theta),500*Math.cos(phi),500*Math.sin(phi)*Math.sin(theta));renderer.render(scene,camera)}animate();</script>{% else %}<div class="alert alert-warning">Panorama 360° belum diunggah untuk destinasi ini.</div>{% endif %}{% endblock %}
