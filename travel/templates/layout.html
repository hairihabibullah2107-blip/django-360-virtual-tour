<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Virtual Tour{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f3f5f7;color:#17202a;padding-top:76px}.navbar{box-shadow:0 3px 18px #0001}.card{border:0;border-radius:16px;overflow:hidden;box-shadow:0 8px 28px #0000000d}.hero{background:#17202a;color:white;border-radius:18px;padding:48px 24px}.thumb{height:210px;object-fit:cover;width:100%}footer{margin-top:48px}</style></head><body><nav class="navbar navbar-expand-lg bg-white fixed-top"><div class="container"><a class="navbar-brand fw-bold" href="{% url 'home' %}">360° Virtual Explorer</a></div></nav><main class="container py-4">{% block content %}{% endblock %}</main><footer class="bg-dark text-white text-center py-3">Virtual Tour Experience</footer></body></html>
